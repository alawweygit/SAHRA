<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../css/style.css">
  <title>HarfHunt single vote fixture</title>
</head>
<body class="theme-dark phones-only-player phones-player-answering">
  <div id="app">
    <div class="screen active" id="scr-controller">
      <div id="ctrlArea"></div>
    </div>
  </div>
  <script>
    window.LANG = 'en';
    window.t = key => key;
    window.esc = value => String(value);
    window.Audio_ = { sfx: { vote() {}, submit() {} } };
  </script>
  <script src="../js/controller.js"></script>
  <script>
    Controller.render(document.getElementById('ctrlArea'), {
      type: 'harfvote',
      category: 'Animals',
      answerText: 'B — BANANA',
      byName: 'Jarvis',
      fullscreenInput: true,
      deadline: Date.now() + 7000,
    }, value => {
      document.body.dataset.submitted = value;
    });
  </script>
</body>
</html>
