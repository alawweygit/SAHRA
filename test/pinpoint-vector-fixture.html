<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    html,body{margin:0;min-height:100%;background:#131020;color:#fff}
    body{padding:12px;box-sizing:border-box}
    #ctrl{max-width:780px;margin:0 auto}
    #reveal{height:60vh;min-height:320px;border-radius:18px;overflow:hidden}
    html.phone body{width:414px}
    html.phone #reveal{width:390px;height:420px;min-height:0}
  </style>
  <script>
    if(new URLSearchParams(location.search).has('phone')) document.documentElement.classList.add('phone');
    if(new URLSearchParams(location.search).has('mock')) document.write('<script src="maplibre-browser-stub.js"><\/script>');
    else document.write('<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"><\/script>');
  </script>
  <script>window.LANG='en';window.t=k=>k;window.Audio_={sfx:{vote(){},pop(){}}};</script>
  <script src="../js/maps.js?v=207"></script>
  <script src="../js/controller.js?v=207"></script>
</head>
<body>
  <div id="ctrl"></div>
  <div id="reveal" hidden></div>
  <script>
    window.__submitted=null;
    if(new URLSearchParams(location.search).get('view')==='reveal'){
      document.getElementById('ctrl').hidden=true;
      const el=document.getElementById('reveal');el.hidden=false;
      const map=HypoxMaps.create(el,{center:[34.0522,-118.2437],zoom:1.8,interactive:false,worldCopies:false});
      map.addHtmlMarker([34.0522,-118.2437],'<div class="pp-city-marker"><div class="pp-city-dot">⭐</div><div class="pp-city-name">Los Angeles<small>United States</small></div></div>',{anchor:'top',offset:[0,-15]});
      map.addHtmlMarker([34.1,-118.2],'<div class="pp-guess-avatar" style="background:#38bdf8">🐬</div>');
      setTimeout(()=>map.flyTo([34.0522,-118.2437],6,{duration:1.2}),250);
    }else{
      Controller.render(document.getElementById('ctrl'),{type:'map',title:'Los Angeles'},value=>{window.__submitted=value;document.body.dataset.submitted=value;});
    }
  </script>
</body>
</html>
